[project]
name = "tiny-llm-lab"
version = "0.1.0"
description = "A small, modular language-model training and inference lab."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets>=4.0,<5",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  # PyTorch 2.2's Intel macOS wheel was compiled against the NumPy 1.x C API.
  "numpy>=1.26,<2",
  "pydantic>=2.11,<3",
  "safetensors>=0.5,<1",
  "tokenizers>=0.21,<1",
  # 2.2.2 keeps CPython 3.12 Intel macOS compatibility. On Windows, uv selects
  # the CUDA 12.1 build from the explicit PyTorch index configured below.
  "torch==2.2.2",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
kaggle = ["kagglehub>=0.3,<1", "pandas>=2.3,<4"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
tiny-llm = "tiny_llm.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_llm"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
