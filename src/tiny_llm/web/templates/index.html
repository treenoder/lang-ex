<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny LLM Lab</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LOCAL LANGUAGE MODEL WORKBENCH</p>
      <h1>Tiny LLM Lab</h1>
      <p>Choose a trained model, inspect its true size, and generate text locally.</p>
    </header>
    <section class="panel controls">
      <label>Model<select id="model"></select></label>
      <div id="metadata" class="metadata">No trained models found.</div>
      <label>Prompt<textarea id="prompt" rows="7" placeholder="Once upon a time..."></textarea></label>
      <div class="grid">
        <label>New tokens<input id="tokens" type="number" value="100" min="1" max="512"></label>
        <label>Temperature<input id="temperature" type="number" value="0.8" min="0" max="2" step="0.1"></label>
        <label>Top-k<input id="top-k" type="number" value="40" min="1" max="500"></label>
      </div>
      <button id="send">Generate</button>
    </section>
    <section class="panel output" aria-live="polite">
      <div id="status">Ready</div>
      <pre id="response">Train a model with the CLI, then refresh this page.</pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
